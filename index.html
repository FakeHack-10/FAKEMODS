<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AndresK1ng | Mods & Hacks</title>
    <!-- Google Fonts & FontAwesome para iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b091a;
            --accent-neon: #a855f7;
            --accent-cyan: #06b6d4;
            --accent-pink: #ec4899;
            --text-main: #f3f4f6;
            --card-bg: rgba(26, 22, 54, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Fondo Animado de Partículas / Estrellas */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: radial-gradient(white 1px, transparent 0);
            background-size: 40px 40px;
            opacity: 0.1;
            z-index: -2;
        }

        /* Efecto de Glitch de Fondo o Luces Neón Flotantes */
        .neon-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, var(--accent-neon), var(--accent-cyan));
            filter: blur(120px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.25;
            animation: floatGlow 8s infinite alternate ease-in-out;
        }

        .glow-1 { top: -100px; left: -100px; }
        .glow-2 { bottom: -100px; right: -100px; animation-delay: 4s; }

        @keyframes floatGlow {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(50px) scale(1.1); }
        }

        /* Contenedor Principal */
        .container {
            max-width: 650px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        /* Tarjeta de Perfil */
        .profile-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 24px;
            padding: 35px 25px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(168, 85, 247, 0.2);
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Avatar con Anillo Neón Giratorio */
        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-neon);
            box-shadow: 0 0 15px var(--accent-neon);
        }

        .avatar-container::after {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%;
            border: 2px dashed var(--accent-cyan);
            animation: spin 10s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-family: 'Share Tech Mono', monospace;
            color: var(--accent-cyan);
            font-size: 14px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Botones de Enlaces / Canales */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            margin-top: 15px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 20px;
            border-radius: 14px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-link i {
            font-size: 20px;
            margin-right: 12px;
        }

        .btn-link .left-content {
            display: flex;
            align-items: center;
        }

        .badge-soon {
            background: rgba(236, 72, 153, 0.2);
            color: var(--accent-pink);
            border: 1px solid var(--accent-pink);
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Efectos Hover Pro */
        .btn-link:hover {
            transform: translateY(-3px);
            background: rgba(168, 85, 247, 0.15);
            border-color: var(--accent-neon);
            box-shadow: 0 5px 20px rgba(168, 85, 247, 0.4);
        }

        .btn-tiktok:hover { border-color: #ff0050; box-shadow: 0 5px 20px rgba(255, 0, 80, 0.4); }
        .btn-youtube:hover { border-color: #ff0000; box-shadow: 0 5px 20px rgba(255, 0, 0, 0.4); }

        /* Reproductor de Música Flotante */
        .music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--accent-neon);
            padding: 10px 15px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .music-player button {
            background: var(--accent-neon);
            border: none;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .music-player button:hover {
            transform: scale(1.1);
            background: var(--accent-cyan);
        }

        .music-info {
            font-size: 12px;
            font-family: 'Share Tech Mono', monospace;
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: rgba(243, 244, 246, 0.4);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="bg-particles"></div>
    <div class="neon-glow glow-1"></div>
    <div class="neon-glow glow-2"></div>

    <div class="container">
        <div class="profile-card">
            <div class="avatar-container">
                <!-- Puedes cambiar la imagen por la tuya -->
                <img src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=150" alt="AndresK1ng" class="avatar">
            </div>
            
            <h1>AndresK1ng</h1>
            <div class="tagline">&lt; Mods & Hacks Official &gt;</div>

            <div class="links-container">
                <!-- TikTok -->
                <a href="https://tiktok.com/@andresk1ng" target="_blank" class="btn-link btn-tiktok">
                    <div class="left-content">
                        <i class="fa-brands fa-tiktok" style="color: #ff0050;"></i>
                        <span>TikTok Oficial</span>
                    </div>
                    <i class="fa-solid fa-arrow-right" style="font-size: 12px; opacity: 0.6;"></i>
                </a>

                <!-- YouTube -->
                <a href="https://youtube.com/@fakehack-haack?si=Lt2ypE3DXJMvGUoT" target="_blank" class="btn-link btn-youtube">
                    <div class="left-content">
                        <i class="fa-brands fa-youtube" style="color: #ff0000;"></i>
                        <span>YouTube</span>
                    </div>
                    <span class="badge-soon">Próximamente</span>
                </a>

                <!-- Aquí puedes dejar tus canales de WhatsApp u otros links que ya tenías -->
                <a href="https://whatsapp.com" target="_blank" class="btn-link">
                    <div class="left-content">
                        <i class="fa-brands fa-whatsapp" style="color: #22c55e;"></i>
                        <span>Canal de WhatsApp</span>
                    </div>
                    <i class="fa-solid fa-arrow-right" style="font-size: 12px; opacity: 0.6;"></i>
                </a>
            </div>
        </div>

        <footer>
            &copy; 2026 AndresK1ng. Todos los derechos reservados.
        </footer>
    </div>

    <!-- Reproductor de Música Opcional (Si subes un archivo "musica.mp3" a GitHub) -->
    <audio id="bg-audio" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <div class="music-player">
        <button id="play-music-btn" onclick="toggleMusic()"><i class="fa-solid fa-play" id="play-icon"></i></button>
        <div class="music-info">
            <span>Cyberpunk Audio</span><br>
            <span style="color: var(--accent-cyan); font-size: 10px;" id="music-status">Pausado</span>
        </div>
    </div>

    <script>
        // Script para controlar el reproductor de música
        const audio = document.getElementById('bg-audio');
        const playBtn = document.getElementById('play-music-btn');
        const playIcon = document.getElementById('play-icon');
        const musicStatus = document.getElementById('music-status');

        function toggleMusic() {
            if (audio.paused) {
                audio.play().then(() => {
                    playIcon.classList.remove('fa-play');
                    playIcon.classList.add('fa-pause');
                    musicStatus.innerText = 'Reproduciendo';
                }).catch(e => {
                    alert("Sube un archivo 'musica.mp3' a tu repositorio de GitHub para que suene la música de fondo.");
                });
            } else {
                audio.pause();
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
                musicStatus.innerText = 'Pausado';
            }
        }
    </script>
</body>
</html>
